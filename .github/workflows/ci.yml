name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ticketty:ticketty@127.0.0.1:5432/ticketty
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      JWT_EXPIRES_IN: 15m
      JWT_ISSUER: ticketty-api
      JWT_AUDIENCE: ticketty-web
      WEB_ORIGIN: http://localhost:3000
      PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint:check
      - run: pnpm typecheck
      - run: pnpm test --runInBand
      - run: pnpm build
      - run: pnpm audit --prod

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticketty
          POSTGRES_USER: ticketty
          POSTGRES_PASSWORD: ticketty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketty -d ticketty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ticketty:ticketty@127.0.0.1:5432/ticketty
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      JWT_EXPIRES_IN: 15m
      JWT_ISSUER: ticketty-api
      JWT_AUDIENCE: ticketty-web
      WEB_ORIGIN: http://localhost:3000
      PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm test:e2e --runInBand
      - run: pnpm test:db:refund-integrity
      - run: pnpm test:db:tenant-consistency
      - run: pnpm test:db:settlement-integrity

  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      API_BASE_URL: http://127.0.0.1:3001/api
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod

  container-builds:
    runs-on: ubuntu-latest
    needs: [backend-quality, backend-integration, web-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --file backend/Dockerfile --tag ticketty-backend:ci backend
      - run: docker build --file web/Dockerfile --tag ticketty-web:ci web
